<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Girlfriend Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:radial-gradient(circle,#203a57,#08111d);
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.page{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.hidden{
    display:none;
}

/* =====================
   BACKGROUND
===================== */

.circle{
    position:absolute;
    border:2px solid rgba(255,255,255,.15);
    border-radius:50%;
    animation:float 10s linear infinite;
    pointer-events:none;
}

@keyframes float{
    0%{
        transform:translateY(0);
    }
    100%{
        transform:translateY(-100vh);
    }
}

/* =====================
   HALAMAN 1
===================== */

.surat{
    width:260px;
    min-height:150px;
    background:#fff1d6;
    border-radius:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    position:absolute;
    bottom:50%;
    opacity:0;
    transform:translateY(40px) scale(.8);
    transition:.8s ease;
    box-shadow:
    0 10px 30px rgba(0,0,0,.35),
    inset 0 0 20px rgba(255,200,150,.3);
    border:3px solid #ffd6a5;
    z-index:20;
}

.surat::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px dashed #f4b183;
    border-radius:12px;
}

.surat.buka{
    opacity:1;
    transform:translateY(-150px) scale(1);
}

#judul{
    font-size:30px;
    font-family:cursive;
    color:#e75480;
    text-align:center;
}

/* Amplop */

.envelope{
    position:absolute;
    bottom:40%;
    width:180px;
    height:120px;
    cursor:pointer;
    transition:.3s;
    z-index:10;
}

.envelope:hover{
    transform:scale(1.05);
}

.base{
    position:absolute;
    bottom:0;
    width:180px;
    height:110px;
    background:#ff8fbe;
    border-radius:0 0 12px 12px;
}

.top{
    position:absolute;
    top:0;
    left:0;
    width:0;
    height:0;
    border-left:90px solid transparent;
    border-right:90px solid transparent;
    border-top:65px solid #ff6ea9;
    transform-origin:top;
    transition:.8s;
    z-index:15;
}

.envelope.open .top{
    transform:rotateX(180deg);
}

.klik{
    position:absolute;
    bottom:25%;
    font-size:18px;
    animation:blink 1.5s infinite;
}

@keyframes blink{
    50%{
        opacity:.5;
    }
}

/* =====================
   HALAMAN 2
===================== */

#page2{
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.box{
    width:90%;
    max-width:620px;
    height:460px;
    background: linear-gradient(rgba(17, 24, 39, 0.75), rgba(17, 24, 39, 0.75)), url('pihad.jpg');
    background-size: cover;
    background-position: center;
    border:4px solid white;
    border-radius:25px;
    padding:30px;
    box-shadow:0 0 20px rgba(255,255,255,.25);
    overflow-y:auto;
    position: relative;
}

#typing{
    color:white;
    font-size:26px;
    line-height:1.8;
    white-space:pre-wrap;
    font-family:'Patrick Hand',cursive;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8); /* Biar teks makin jelas di atas foto */
}

#loveBtn{
    margin-top:30px;
    width:240px;
    height:70px;
    border:none;
    border-radius:50px;
    background:#ff5fa2;
    color:white;
    font-size:22px;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

#loveBtn:hover{
    transform:scale(1.08);
}

/* =====================
   HALAMAN 3
===================== */

#page3{
    display:none;
}

.akhir{
    width:90%;
    max-width:420px;
    background:#111827;
    border:3px solid white;
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 20px rgba(255,255,255,.25);
}

.heartbesar{
    font-size:70px;
    animation:denyut 1s infinite;
}

@keyframes denyut{
    50%{
        transform:scale(1.2);
    }
}

.akhir h1{
    color:#ff5fa2;
    margin:15px 0;
    font-family:cursive;
}

.akhir p{
    font-family:'Patrick Hand',cursive;
    font-size:24px;
    line-height:1.8;
}

.akhir button{
    margin-top:20px;
    padding:13px 35px;
    border:none;
    border-radius:40px;
    background:#ff5fa2;
    color:white;
    font-size:18px;
    cursor:pointer;
}

</style>
</head>

<body>

<script>

// Background lingkaran

for(let i=0;i<12;i++){

    let c=document.createElement("div");

    c.className="circle";

    let ukuran=60+Math.random()*120;

    c.style.width=ukuran+"px";
    c.style.height=ukuran+"px";

    c.style.left=Math.random()*100+"%";
    c.style.top=Math.random()*100+"%";

    document.body.appendChild(c);

}

</script>

<!-- ================= HALAMAN 1 ================= -->

<div class="page" id="page1">

    <div class="surat" id="surat">
        <h2 id="judul"></h2>
    </div>

    <div class="envelope" id="amplop" onclick="buka()">

        <div class="top"></div>

        <div class="base"></div>

    </div>

    <p class="klik">
        Klik amplopnya yaa... 💌
    </p>

</div>

<!-- ================= HALAMAN 2 ================= -->

<div class="page" id="page2" style="display:none;">

    <div class="box" id="boxContainer">

        <div id="typing"></div>

    </div>

    <button id="loveBtn">

        ❤️ I Love You ❤️

    </button>

</div>

<!-- ================= HALAMAN 3 ================= -->

<div class="page" id="page3" style="display:none;">

    <div class="akhir">

        <p>

            Terima kasih yaa karena sudah menjadi bagian dari hidupku.

            <br><br>

            Semoga kamu selalu sehat,

            <br><br>

            Jangan lupa tetap jadi diri kamu yang aku kenal.

            Aku sayang kamu, hari ini, besok, dan seterusnya. ❤️

function ketik(){

    if(i<text.length){
